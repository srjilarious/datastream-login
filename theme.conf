[General]
# Monospace font for the terminal and banners.
Font=JetBrains Mono

# Color palette: neon (cyan, magenta and amber city) or phosphor (an old
# green monochrome monitor). Palettes live in shared/palettes.js.
Palette=neon

# Name in the terminal header and boot log. Empty uses the host name.
NodeName=

# Turn the flying city or the hex rain off. With City=false the rain falls
# over a black screen.
City=true
Rain=true

# Any color below overrides the palette's value. Leave them commented out to
# use the palette as is.
# Terminal colors.
#Accent=#00e5ff
#TextColor=#b8f7ff
#OkColor=#39ff88
#AlertColor=#ff2b4f
# City: the three tower colors and the street grid.
#TintA=#00e5ff
#TintB=#ff2bd6
#TintC=#ffb000
#GroundTint=#7a2cff
# Hex rain.
#RainTint=#1aff7a
#RainHeadTint=#e8fff2
# The two offset ghost copies behind ACCESS GRANTED / DENIED.
#GhostA=#ff2bd6
#GhostB=#00e5ff
# 0..1: how far the CRT pass reduces everything to one phosphor color.
#Monochrome=0
#MonochromeTint=#33ff66

# Flight speed in cells per second. Climb=true rises above the rooftops now and then.
FlySpeed=0.9
Climb=true

# The city is rendered at this fraction of the screen size and then upscaled.
# Lower it (e.g. 0.5) on weak GPUs or 4K screens.
RenderScale=0.75

# Hex rain over the city. Density is the share of columns that carry a stream.
RainOpacity=0.55
RainDensity=0.45

# CRT scanline strength 0..1, and random small glitches while idle.
Scanlines=0.6
IdleGlitch=true
