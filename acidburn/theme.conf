[General]
# Font for the prompt and banners.
Font=JetBrains Mono

# Color palette: film (blue plasma, cream and gold emblem, as in the movie)
# or toxic (green plasma, hot pink emblem). Palettes live in
# acidburn/shared/palettes.js.
Palette=film

# Name in the line above the handle. Empty uses the host name.
NodeName=

# Play the diamond intro (any key skips it). With Intro=false the screen
# starts on the flame and the prompt.
Intro=true

# The plasma whirls around the mouse pointer as it moves.
PointerSwirl=true

# Plasma flow speed. Typing speeds it up for a moment.
FlowSpeed=0.35

# The plasma is rendered at this fraction of the screen size and then
# upscaled. Lower it (e.g. 0.4) on weak GPUs or 4K screens.
RenderScale=0.6

# Halftone dots stacked across the diamond's height. More dots, finer
# detail.
HalftoneDots=34

# Scanline strength 0..1, and now and then a flare and a small glitch
# while idle.
Scanlines=0.15
IdleGlitch=true

# Any color below overrides the palette's value. Leave them commented out to
# use the palette as is.
# Prompt.
#Accent=#e2c98a
#TextColor=#efe6cc
#OkColor=#9fe0ff
#AlertColor=#ff4a2a
# Plasma.
#PlasmaDeep=#02040f
#PlasmaMid=#2043d8
#PlasmaLight=#cdd5ff
#PlasmaSheen=#2bd98a
#PlasmaStreak=#d0303a
# Diamond and scorched paper.
#Gold=#c8ad6c
#Cream=#efe3c0
#Rust=#a4471e
#Soot=#2a1408
#SkyTint=#a9cbe6
# Flame: dots before the plasma shows, then a ramp over the plasma.
#DotTint=#cfd0f5
#FlameLow=#3b3522
#FlameHigh=#f6f2ff
# The two offset ghost copies behind ACCESS GRANTED / DENIED.
#GhostA=#2a4cff
#GhostB=#e2c98a
